name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Reject tracked PDFs
        shell: python
        run: |
          import subprocess
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          pdfs = [path for path in tracked if path.lower().endswith('.pdf')]
          if pdfs:
              raise SystemExit('PDF files must not be tracked: ' + ', '.join(pdfs))
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check CLI
        run: python src/pdf_obfuscator.py --help
      - name: Run synthetic regression tests
        run: python -m unittest discover -s tests -v
